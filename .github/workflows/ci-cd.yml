name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        required: true
        default: 'staging'
        options:
          - staging
          - production
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: acr.io
  IMAGE_NAME: app

jobs:
  ci:
    runs-on: ubuntu-latest
    name: CI Job
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Generate code coverage
        run: npm run test:coverage

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v3
        with:
          name: code-coverage
          path: coverage/

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Package Helm chart
        run: |
          helm package ./helm/chart -d ./helm-packages

      - name: Push Helm chart to ACR
        run: |
          helm push ./helm-packages/${{ env.IMAGE_NAME }}*.tgz oci://${{ env.REGISTRY }}

  cd:
    needs: ci
    runs-on: ubuntu-latest
    name: CD Job
    environment: app-${{ github.event.inputs.environment }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Helm Login to ACR
        run: |
          az acr login --name ${{ env.REGISTRY }}

      - name: Pull Helm chart
        run: |
          helm pull oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --version ${{ github.sha }} \
            -d ./helm-charts

      - name: Validate Helm chart
        run: |
          helm lint ./helm-charts/

      - name: Helm upgrade/install release
        run: |
          helm upgrade --install ${{ env.IMAGE_NAME }}-release \
            oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --version ${{ github.sha }} \
            --namespace default \
            --create-namespace \
            --values ./helm/values.yaml \
            --wait

      - name: Verify deployment status
        run: |
          kubectl rollout status deployment/${{ env.IMAGE_NAME }}-release \
            -n default \
            --timeout=5m
          kubectl get pods -n default

      - name: Rollback on failure
        if: failure()
        run: |
          helm rollback ${{ env.IMAGE_NAME }}-release \
            --namespace default
          echo "Deployment failed. Rolled back to previous version."
