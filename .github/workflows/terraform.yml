name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  terraform-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.7'

      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: TFLint scan
        uses: terraform-linters/tflint-action@v1

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform fmt check
        run: terraform fmt -check

      - name: Checkov scan
        uses: bridgecrew/checkov-action@v12
        with:
          directory: .

      - name: Publish PR summary
        run: |
          echo "## Terraform PR Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pull request: ${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform version: $(terraform version | head -n1)" >> $GITHUB_STEP_SUMMARY
          echo "- TFLint and Checkov scans completed" >> $GITHUB_STEP_SUMMARY

  terraform-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.7'

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: TFLint scan
        uses: terraform-linters/tflint-action@v1

      - name: Terraform fmt check
        run: terraform fmt -check

      - name: Checkov scan
        uses: bridgecrew/checkov-action@v12
        with:
          directory: .

      - name: Terraform apply
        run: terraform apply -auto-approve -var="environment=${TF_VAR_environment}"

      - name: Publish merge summary
        run: |
          echo "## Terraform Merge Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: $TF_VAR_environment" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform version: $(terraform version | head -n1)" >> $GITHUB_STEP_SUMMARY
          echo "- TFLint and Checkov scans completed" >> $GITHUB_STEP_SUMMARY
